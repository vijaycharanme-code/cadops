[package]
name = "cadmind"
version = "0.1.0"
description = "CADMind: Offline AI Engineering Design and Simulation Studio"
authors = ["CADMind Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
sysinfo = "0.30"
which = "6.0"
